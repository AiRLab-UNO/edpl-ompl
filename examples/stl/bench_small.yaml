# Small benchmark workspace for firmcp-stl-demo.
# Obstacles here drive the QuadtreeCollisionChecker (state validity).
# They MUST mirror the ox*_{x,y} params in bench_small.spec so STL robustness
# and collision checking agree on the world.
max_speed: 1.0
min_speed: 0.0
max_yawrate: 0.6981
dt: 0.1
predict_time: 1.5
pref_speed_index: 5
num_samples: 5
goal_radius: 0.4
robot_radius: 0.4
boundary: [-3.0, 3.0, -3.0, 3.0]
obstacles:
  - [-1.0, -1.0]
  - [ 1.0,  0.5]
  - [ 0.0, -2.0]
solver_timeout: 5
restart: 5
num_neighbors: 3
verbose: false
output_file: "trajectory.csv"
smooth_tau: 10.0
smooth_type: "SOFTMAX"
solver: "KB"
