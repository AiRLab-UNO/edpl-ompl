landmarks:
  - {id: 15, x: 10.0, y: 8.875}
  - {id: 16, x: 10.0, y: 11.125}

observation_model:
  type: HeadingBeacon
  sigma_ss: 0.005
  sigma_heading: 1.0e-6

motion_model:
  type: Omnidirectional
  sigma_v: 0.0
  eta_v: 0.0
  sigma_omega: 0.0
  eta_omega: 0.0
  wind_noise_pos: 0.001
  wind_noise_ang: 1.0e-6
  min_linear_velocity: -1.0
  max_linear_velocity: 1.0
  max_angular_velocity: 0.6
  dt: 0.1

firm:
  data_log:
    save: true
    folder: "../results/"
  save_roadmap: true
  mc_particles: 5
  rollout_steps: 1
  nn_radius: 2.25
  num_nn: 10
  dp_discount_factor: 1.0
  dist_cost_weight: 0.1
  connect_to_future_nodes: false
  apply_stationary_penalty: true
  border_belief_sampling: false
  inf_cost_weight: 100.0
  time_cost_weight: 0.0
  stat_cost_inc: 1.0
  goal_cost_to_go: 0.0
  obstacle_cost_to_go: 20000.0
  init_cost_to_go: 2.0
  max_dp_iter: 1000
  dp_convergence_threshold: 0.1

firmcp:
  num_pomcp_particles: 3
  max_pomcp_depth: 5
  max_firm_reach_depth: 200
  n_sigma_for_pomcp_particle: 3.0
  c_exploration_for_simulate: 1.0e-9
  c_exploitation_out_of_reach: 10.0
  c_exploitation_within_reach: 10.0
  cost_to_go_regulator_out_of_reach: 1.0e-6
  cost_to_go_regulator_within_reach: 1.0e-6
  n_epsilon_for_rollout_is_reached: 3.0
  heur_pos_step_size: 0.1
  heur_ori_step_size: 0.05
  heur_cov_step_size: 1.0e-5
  cov_convergence_rate: 0.99
  scale_stab_num_steps: 30
  n_epsilon_for_qv_node_merging: 50.0
  inflation_for_approx_stab_cost: 100

stl_firmcp:
  # STL formula evaluated on a 2-point trace (from-node → to-node).
  # Signals:
  #   tr_cov    – trace of the belief covariance (lower = more confident)
  #   dist_goal – Euclidean distance of the robot mean to the goal
  # Parameters (tunable below):
  #   cov_max   – maximum acceptable trace(P)
  #   eps_goal  – goal-reaching distance threshold
  #
  # Robustness ρ > 0 when BOTH conditions are satisfied.
  # Cost contribution = −ρ * stl_cost_scale  (negative = reward, positive = penalty).
  # STLRom syntax: alw_/ev_, signal[t], < or >, and/or
  # Signals (col layout): tr_cov=col1, dist_goal=col2
  # Params are declared automatically from cov_max/eps_goal below.
  stl_formula: |
    phi_info  := tr_cov[t] < cov_max
    phi_reach := dist_goal[t] < eps_goal
    phi := alw_[0, 1] phi_info and ev_[0, 1] phi_reach

  # Belief quality threshold: trace(P) must stay below this value
  cov_max: 1.0

  # Goal-reaching distance threshold [m]
  eps_goal: 2.0

  # Blend weight λ in [0,1]: 0 = pure FIRM heuristic, 1 = pure STL cost
  lambda_stl: 1.0

  # Scale factor to bring -ρ into FIRM cost-to-go range
  # (obstacle_cost_to_go ≈ 20000, so scale accordingly)
  stl_cost_scale: 20000.0

  # Smooth approximation temperature (higher → closer to exact min/max)
  smooth_tau: 1.0

  # Smooth approximation type: LSE (log-sum-exp), SOFTMAX, or EXACT
  smooth_type: SOFTMAX

planning_problem:
  planner_method: 3        # 0=FIRM 1=Rollout 2=MultiModal 3=FIRMCP
  dynamic_obstacles: false
  environment_file: ../examples/configs/Models/FIRMCP_Wall_0.obj
  robot_file: ../examples/configs/Models/iRobot_thin.obj
  roadmap_file: "../examples/configs/Roadmaps/FIRMRoadMap-Beacon.yaml"
  use_roadmap: true
  firm_nodes_min: 400
  firm_nodes_max: 852
  start: {x: 2.0, y: 10.0}
  planning_time: 800.0
  kidnapped_state: {x: 1.5, y: 19.5}

goals:
  - {x: 18.0, y: 10.0}

goal_constraints:
  mean_norm_weight: 3.0
  cov_norm_weight: 1.0
  reach_dist: 0.1
