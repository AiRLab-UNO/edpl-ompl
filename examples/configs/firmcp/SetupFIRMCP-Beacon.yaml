landmarks:
  - {id: 15, x: 10.0, y: 8.875}
  - {id: 16, x: 10.0, y: 11.125}

observation_model:
  type: HeadingBeacon
  sigma_ss: 0.005
  sigma_heading: 1.0e-6

motion_model:
  type: Omnidirectional
  sigma_v: 0.0
  eta_v: 0.0
  sigma_omega: 0.0
  eta_omega: 0.0
  wind_noise_pos: 0.001
  wind_noise_ang: 1.0e-6
  min_linear_velocity: -0.4
  max_linear_velocity: 0.4
  max_angular_velocity: 0.3
  dt: 0.05

firm:
  data_log:
    save: true
    folder: "../results/"
  save_roadmap: true
  mc_particles: 5
  rollout_steps: 2
  nn_radius: 2.25
  num_nn: 12
  dp_discount_factor: 1.0
  dist_cost_weight: 0.1
  connect_to_future_nodes: true
  apply_stationary_penalty: true
  border_belief_sampling: false
  inf_cost_weight: 100.0
  time_cost_weight: 0.0
  stat_cost_inc: 1.0
  goal_cost_to_go: 0.0
  obstacle_cost_to_go: 20000.0
  init_cost_to_go: 2.0
  max_dp_iter: 1000
  dp_convergence_threshold: 0.1

firmcp:
  num_pomcp_particles: 10
  max_pomcp_depth: 4
  max_firm_reach_depth: 200
  n_sigma_for_pomcp_particle: 2.0
  c_exploration_for_simulate: 1.0
  c_exploitation_out_of_reach: 3.0
  c_exploitation_within_reach: 3.0
  cost_to_go_regulator_out_of_reach: 1.0e-3
  cost_to_go_regulator_within_reach: 1.0e-3
  n_epsilon_for_rollout_is_reached: 2.0
  heur_pos_step_size: 0.05
  heur_ori_step_size: 0.03
  heur_cov_step_size: 1.0e-6
  cov_convergence_rate: 0.97
  scale_stab_num_steps: 40
  n_epsilon_for_qv_node_merging: 20.0
  inflation_for_approx_stab_cost: 100

stl_firmcp:
  # STL formula evaluated on the full rollout trajectory.
  # Signals:
  #   tr_cov     – trace of the belief covariance (lower = more confident)
  #   dist_goal  – Euclidean distance of the robot mean to the goal
  #   safe       – collision-free state indicator (1 = safe, 0 = unsafe)
  #   firm_cost  – heuristic FIRM cost-to-go for the visited vertex
  # Parameters (tunable below):
  #   cov_max      – maximum acceptable trace(P)
  #   eps_goal     – goal-reaching distance threshold
  #   firm_cost_max – maximum acceptable heuristic FIRM cost
  #
  # Robustness ρ > 0 when all conditions are satisfied.
  # Cost contribution = −ρ * stl_cost_scale.
  # STLRom syntax: alw_/ev_, signal[t], > / <, and
  stl_formula: |
    phi_safe  := alw_[0, 1] (safe[t] > 0)
    phi_firm  := alw_[0, 1] (firm_cost_max - firm_cost[t] > 0)
    phi_info  := alw_[0, 1] (cov_max - tr_cov[t] > 0)
    phi_reach := ev_[0, 1] (eps_goal - dist_goal[t] > 0)
    phi := phi_safe and phi_firm and phi_info and phi_reach

  # Belief quality threshold: trace(P) must stay below this value
  cov_max: 0.8

  # Goal-reaching distance threshold [m]
  eps_goal: 1.0

  # Heuristic FIRM cost threshold (lower is better)
  firm_cost_max: 25000.0

  # Compatibility parameter retained for older configs (not used)
  lambda_stl: 1.0

  # Scale factor to bring -ρ into FIRM cost-to-go range
  # (obstacle_cost_to_go ≈ 20000, so scale accordingly)
  stl_cost_scale: 5000.0

  # Smooth approximation temperature (higher → closer to exact min/max)
  smooth_tau: 2.0

  # Smooth approximation type: LSE (log-sum-exp), SOFTMAX, or EXACT
  smooth_type: SOFTMAX

planning_problem:
  planner_method: 3        # 0=FIRM 1=Rollout 2=MultiModal 3=FIRMCP
  dynamic_obstacles: false
  environment_file: ../examples/configs/Models/FIRMCP_Wall_0.obj
  robot_file: ../examples/configs/Models/iRobot_thin.obj
  roadmap_file: "../examples/configs/Roadmaps/FIRMRoadMap-Beacon.yaml"
  use_roadmap: true
  firm_nodes_min: 400
  firm_nodes_max: 852
  start: {x: 2.0, y: 10.0}
  planning_time: 800.0
  kidnapped_state: {x: 1.5, y: 19.5}

goals:
  - {x: 18.0, y: 10.0}

goal_constraints:
  mean_norm_weight: 3.0
  cov_norm_weight: 1.0
  reach_dist: 0.1
